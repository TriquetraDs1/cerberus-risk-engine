name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install ruff

      - name: Lint (ruff)
        run: ruff check src/ scripts/ tests/

      - name: Run the offline pipeline (data -> detection -> decision layer)
        run: |
          python scripts/generate_data.py
          python scripts/detect_rings.py
          python scripts/train_baseline.py
          python scripts/build_decision_layer.py

      # Reruns the adaptive evasion search against the current model, retrains on
      # what it finds, and fails the build only if hardening ever makes a strategy's
      # detection *worse* than before hardening — a regression gate, not a quality
      # bar. See the script's own docstring for why it must not fail over an
      # honestly-reported small (but non-negative) recovery.
      - name: Adversarial regression gate
        run: python scripts/run_adversarial_harness.py --min-recovery -0.05

      - name: Export dashboard data
        run: python scripts/export_dashboard_data.py

      # Runs last, not first: test_serving.py needs the trained model + decision
      # layer produced above to exercise the live API rather than skipping.
      - name: Run tests
        run: pytest tests/ -v
