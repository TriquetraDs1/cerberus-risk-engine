name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install ruff

      - name: Lint (ruff)
        run: ruff check src/ scripts/ tests/

      - name: Run tests
        run: pytest tests/ -v

      - name: Generate synthetic data + train baseline
        run: |
          python scripts/generate_data.py
          python scripts/train_baseline.py

      # Placeholder for the day the adversarial harness lands: this job should
      # rerun the evasion suite and fail the build if recall decay exceeds a
      # tolerance, turning the differentiator into a CI-enforced regression
      # gate instead of a one-off script. See docs/ARCHITECTURE.md, Day 5-6.
      # - name: Adversarial regression gate
      #   run: python scripts/run_adversarial_harness.py --fail-on-decay 0.15
