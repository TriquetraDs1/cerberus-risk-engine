[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cerberus"
version = "0.1.0"
description = "Adversarially-hardened transaction risk engine (defensive research project)"
requires-python = ">=3.10"

[project.optional-dependencies]
# A1 narration layer. Not required: with no anthropic and no ANTHROPIC_API_KEY the
# pipeline, dashboard export, API, and CI all run and use the deterministic template.
llm = ["anthropic>=0.40"]
# Offline research tooling — scripts/tune_baseline.py only. Not needed to run the
# pipeline, the API, or CI: the tuned params it finds are checked in as LGBM_PARAMS.
tuning = ["optuna>=4.0", "scikit-optimize>=0.10"]
# Roadmap B2 — the per-account sequence model (scripts/train_sequence.py).
sequence = ["torch>=2.0"]
# Roadmap B1 — the GraphSAGE ring detector (scripts/train_gnn_rings.py). Louvain, the
# default detector, needs neither.
gnn = ["torch>=2.0", "torch-geometric>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
